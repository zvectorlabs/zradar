[graph]
targets = []

# ── licenses ──────────────────────────────────────────────────────────────────
# Licenses not in this list are denied. GPL/AGLP are excluded by omission.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "CC0-1.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = []

# ── security advisories ───────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    { id = "RUSTSEC-2024-0436" },
    { id = "RUSTSEC-2024-0370" },
    { id = "RUSTSEC-2024-0384" },
    { id = "RUSTSEC-2025-0134" },
    { id = "RUSTSEC-2024-0363" },
    { id = "RUSTSEC-2026-0002" },
    { id = "RUSTSEC-2026-0194" },
    { id = "RUSTSEC-2026-0195" },
    # zstd 0.13 advisories, unreachable here. The fixes need zstd >= 0.14.3 /
    # zstd-safe >= 8.2, which arrow-ipc and parquet 58 (pinned by DataFusion
    # 54) do not accept yet. Remove these once the DataFusion/Arrow upgrade
    # brings them in.
    # Stream `with_context` reuse: OTLP/HTTP decodes with
    # `Decoder::with_buffer`, arrow/parquet use the `bulk` API, and
    # async-compression (compression-codecs) uses `raw::Decoder::new`;
    # none call `with_context`.
    { id = "RUSTSEC-2026-0391", reason = "with_context stream API not used" },
    # Legacy (v0.4-v0.7) frames: the workspace zstd dependency sets
    # `default-features = false` and nothing re-enables `legacy`. Re-check
    # this when dependencies change.
    { id = "RUSTSEC-2026-0403", reason = "zstd legacy feature disabled" },
]

# ── dependency bans ───────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []

# ── sources ───────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
